<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Files in `public` are served from the site root, so the path is
         "/logo/..." and NOT "public/logo/...". -->
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Josefin Sans: the project-wide font. Preconnect makes it load faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <title>Intelligere</title>

    <!-- Light / dark mode, applied BEFORE the first paint so a dark-mode
         user never sees a white flash while the app loads. Same rules as
         src/Library/theme.js (key "theme"; nothing saved -> light). -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'dark') theme = 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
